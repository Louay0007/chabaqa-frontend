name: Deploy Frontend to VPS (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ secrets.API_INTERNAL_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
          
          # Create an env file locally on the runner
          cat > injected.env <<EOF_INNER
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          API_INTERNAL_URL=${API_INTERNAL_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          JWT_SECRET=${JWT_SECRET}
          EOF_INNER
          
          # Copy it over via SCP
          scp -P "${VPS_PORT:-22}" injected.env "$VPS_USER@$VPS_HOST:/tmp/injected.env"
          
          # Run remote commands
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" << 'REMOTE_SCRIPT'
            set -euo pipefail
            
            # 1. Update frontend repository
            cd /home/ubuntu/chabaqa/chabaqa-frontend
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Merge secrets safely into docker/frontend.env
            ENV_FILE="/home/ubuntu/chabaqa/docker/frontend.env"
            
            while IFS='=' read -r key value; do
              # skip empty lines or comments
              if [[ -z "$key" ]] || [[ "$key" == \#* ]]; then continue; fi
              # strip leading/trailing spaces
              key=$(echo "$key" | xargs)
              
              if grep -q "^${key}=" "$ENV_FILE"; then
                # We use python to safely replace the key-value without sed escaping issues
                python3 -c "
import sys, re
key = sys.argv[1]
value = sys.argv[2]
with open(sys.argv[3], 'r') as f: data = f.read()
data = re.sub(r'(?m)^' + re.escape(key) + r'=.*$', key + '=' + value.replace('\\\\', '\\\\\\\\'), data)
with open(sys.argv[3], 'w') as f: f.write(data)
" "$key" "$value" "$ENV_FILE"
              else
                echo "${key}=${value}" >> "$ENV_FILE"
              fi
            done < /tmp/injected.env
            rm -f /tmp/injected.env
            
            # 3. Trigger Docker Deploy for frontend
            cd /home/ubuntu/chabaqa
            chmod +x docker-deploy.sh
            sudo ./docker-deploy.sh --frontend
          REMOTE_SCRIPT
